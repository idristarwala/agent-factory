apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-factory.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app: {{ include "agent-factory.name" . }}
