replicaCount: 1

image:
  repository: ghcr.io/idristarwala/agent-factory-starter
  tag: latest
  digest: ""  # Takes precedence over tag
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 8080

env:
  SECRETS_DIR: /etc/secrets

# Environment variable -> {name: existing Kubernetes Secret, key: data key}
secretEnv: {}

secrets:
  # Mounted at SECRETS_DIR
  enabled: true
  name: ""
  optional: true

resources: {}
