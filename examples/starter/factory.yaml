# Starter factory.yaml — pin the engine version and declare shared config.
# Users copy this into their own repo; the engine is a versioned dependency.
engine:
  version: v0.1.0          # digest-pinned release (see docs/RELEASE.md)
  image: ghcr.io/idristarwala/agent-factory@sha256:example

packs:
  - path: packs/catalog

tools:
  # Config-driven HTTP tools (issue #12). Secrets from files, never env.
  catalog.get_item:
    description: Full record for one item
    method: GET
    url: https://catalog.example.com/v2/items/{id}
    auth:
      type: bearer
      key_file: /run/secrets/catalog_token
    side_effect: read-only

gateway:
  name: corp
  base_url: https://llm-gateway.example.com/v1
  auth_type: bearer
  key_file: /run/secrets/llm_key
  headers:
    X-Consumer-Id: my-app
  ca_file: /etc/ssl/corp-ca.pem
  proxy: none

models:
  cheap:
    protocol: gemini
    model: gemini-flash
    reasoning_budget: 0
  frontier:
    protocol: openai
    model: gpt-large
    token_param: max_completion_tokens
