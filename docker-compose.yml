services:
  factory:
    build: .
    environment:
      - DATABASE_URL=postgres://factory:factory@postgres:5432/factory?sslmode=disable
      - SECRETS_DIR=/etc/secrets
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY
      - ANTHROPIC_API_KEY
      - OPENROUTER_API_KEY
      - LLM_BASE_URL
      - LLM_API_KEY
      - LLM_GATEWAY_CONFIG
      - API_TOKEN
      - FACTORY_OPERATOR_TOKEN
      - FACTORY_VIEWER_TOKEN
      - FACTORY_API_READ_TIMEOUT
      - FACTORY_API_WRITE_TIMEOUT
      - FACTORY_API_IDLE_TIMEOUT
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - ./secrets:/etc/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["api"]
    ports:
      - "127.0.0.1:8080:8080"

  postgres:
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
