name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build binaries
        run: make release

      - name: Build and push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/${{ github.repository }}:${{ github.ref_name }} .
          docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ github.repository }}:${{ github.ref_name }} | cut -d@ -f2)
          echo "DIGEST=$DIGEST" >> $GITHUB_ENV
          echo "Image digest: $DIGEST"

      - name: Write manifest
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib
          dist = pathlib.Path("dist")
          files = sorted(path.name for path in dist.iterdir() if path.is_file())
          manifest = {
              "version": os.environ["GITHUB_REF_NAME"],
              "image": f"ghcr.io/{os.environ['GITHUB_REPOSITORY']}@{os.environ['DIGEST']}",
              "binaries": files,
          }
          (dist / "release-manifest.json").write_text(json.dumps(manifest, indent=2))
          PYTHON

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
