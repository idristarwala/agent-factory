name: Release image

on:
  pull_request:
    paths:
      - Dockerfile
      - LICENSE
      - scripts/build-binaries.sh
      - .github/workflows/release-image.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release image and verify its embedded notice
        run: |
          docker build --tag factory-release-check .
          docker run --rm --entrypoint cat factory-release-check /usr/share/licenses/agent-factory/LICENSE | cmp - LICENSE
          docker run --rm --env FACTORY_STORE_MODE=memory --entrypoint factory factory-release-check readiness
