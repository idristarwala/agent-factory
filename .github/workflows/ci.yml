name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: factory_test
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Check new exported internal helpers for production callers
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check-unused-helpers.py "$BASE_SHA"
      - name: Documentation contracts
        run: make docs-check
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          TEST_POSTGRES_DSN: postgres://postgres:test@localhost:${{ job.services.postgres.ports[5432] }}/factory_test?sslmode=disable
        run: go test -race ./...
      - name: Gateway conformance
        run: make conformance
      - name: Build
        run: go build ./...

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui-app/package-lock.json
      - run: make ui-build
