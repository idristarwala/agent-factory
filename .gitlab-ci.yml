# GitLab CI for an engine source checkout. For a consuming workspace, see
# https://github.com/idristarwala/agent-factory-starter/blob/main/.gitlab-ci.yml
# Runs validation and fixture tests without requiring live model keys.
# See docs/GETTING_STARTED.md and issue #9.

stages:
  - validate
  - test

variables:
  GO_VERSION: "1.26"

validate:
  stage: validate
  image: golang:${GO_VERSION}
  script:
    - go run ./cmd/factory validate examples/starter/factory.yaml
    - go run ./cmd/factory readiness

test:
  stage: test
  image: golang:${GO_VERSION}
  script:
    - go run ./cmd/factory test
